<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>CountDown Timer</h1>
    <div class="container">
      <input type="text" class="dayInput" placeholder="Enter day" />
      <input type="text" class="hrInput" placeholder="Enter hr" />
      <input type="text" class="minsInput" placeholder="Enter mins" />
      <input type="text" class="secsInput" placeholder="Enter secs" />
    </div>
    <div class="countDisplay">
      <div class="day">0<br />Days</div>
      <div class="hr">0<br />Hr</div>
      <div class="mins">0<br />Mins</div>
      <div class="secs">0<br />Secs</div>
    </div>
    </div>
     <div class="btns">
      <button class="btn">Start CountDown</button>
      <button class="reset-btn">Reset CountDown</button>
      <button class="pause-btn">Pause CountDown</button>
</div>
<p>*Note CountDown will start after 2secs</p>
   <script src="scrip.js"></script>
  </body>
</html>
